name: CI Pipeline Dry-Run & Quality Gates Verification

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Pre-Commit Secret Scanner Check
        run: |
          python scripts/scan_secrets.py

      - name: 2. Run Legacy Layout Failure Proof Test
        run: |
          python scripts/test_legacy_layout_fail.py

      - name: 3. Run Quality Gates Defect Detection Test
        run: |
          python scripts/test_defect_detection_on_failing_sample.py

      - name: 4. Run Telegram Control Plane Tests (16 Scenarios)
        run: |
          python scripts/test_telegram_controls.py

      - name: 5. Verify Bunty Reference Acoustic Benchmarks
        run: |
          python -c "
          import config
          print('Bunty Reference Benchmarks:', config.BUNTY_REFERENCE)
          "
