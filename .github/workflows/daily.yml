name: daily-reels
on:
  schedule:
    - cron: "0 7 * * *"    # 12:30 PM IST -> video 1 (repo spotlight, ElevenLabs)
    - cron: "0 15 * * *"   # 8:30 PM IST  -> video 2 (AI topic, edge-tts)
  workflow_dispatch:
    inputs:
      slot: {description: "1 or 2", default: "1"}
      dry: {description: "dry run (no posting) true/false", default: "false"}
permissions:
  contents: write
jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Make + post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAND: ${{ vars.BRAND }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT" ]; then
            if [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then SLOT=1; else SLOT=2; fi
          fi
          DRY=""; [ "${{ github.event.inputs.dry }}" = "true" ] && DRY="--dry-run"
          python main.py --slot "$SLOT" $DRY
      - uses: actions/upload-artifact@v4
        with: {name: reels, path: "out/*.mp4", retention-days: 7}
      - name: Save history
        run: |
          git config user.name "reel-bot"; git config user.email "bot@users.noreply.github.com"
          git add history.json; git diff --cached --quiet || (git commit -m "update history" && git push)
